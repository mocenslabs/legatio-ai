name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # Backend: Lint, Type Check & Test
  # ──────────────────────────────────────────────
  backend:
    name: Backend (lint + type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legatio
          POSTGRES_USER: legatio
          POSTGRES_PASSWORD: legatio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instalamos development.txt que incluye mypy, django-stubs, pytest, etc.
          pip install -r requirements/development.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Mypy
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
        run: mypy .

      - name: Check Django configuration
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
        run: python manage.py check

      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest with coverage
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: legatio
          DB_USER: legatio
          DB_PASSWORD: legatio
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov (Optional)
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  # ──────────────────────────────────────────────
  # Frontend: Lint, Type Check & Build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check
