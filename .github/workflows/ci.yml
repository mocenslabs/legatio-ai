name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + format + type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legatio
          POSTGRES_USER: legatio
          POSTGRES_PASSWORD: legatio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
      - name: Run Ruff lint
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .
      - name: Run Mypy
        run: mypy .
      - name: Check Django configuration
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
        run: python manage.py check
      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
        run: python manage.py makemigrations --check --dry-run
      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: legatio.settings.development
          SECRET_KEY: ci-test-secret-key
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: legatio
          DB_USER: legatio
          DB_PASSWORD: legatio
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: pytest

  frontend:
    name: Frontend (lint + format + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check Prettier formatting
        run: npm run format:check
      - name: Run TypeScript check
        run: npm run type-check
      - name: Run Vitest
        run: npm test
      - name: Build frontend
        run: npm run build

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements/development.txt
        working-directory: backend
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
