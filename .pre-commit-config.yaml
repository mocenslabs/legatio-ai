# Legatio AI pre-commit configuration.
# Run: pre-commit run --all-files
# The project environments are the source of truth for Ruff, Mypy, Prettier,
# and ESLint versions, so local hooks use the installed project tooling.

repos:
  # ──────────────────────────────────────────────
  # General hooks
  # ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: debug-statements

  # ──────────────────────────────────────────────
  # Backend: Ruff lint
  # ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: bash -c 'cd backend && .venv/bin/ruff check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        exclude: |
          (?x)^(
            backend/.*/migrations/.*|
            backend/.venv/.*
          )$

  # ──────────────────────────────────────────────
  # Backend: Ruff format
  # ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && .venv/bin/ruff format --check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        exclude: |
          (?x)^(
            backend/.*/migrations/.*|
            backend/.venv/.*
          )$

  # ──────────────────────────────────────────────
  # Backend: Mypy
  # ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && .venv/bin/mypy .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        exclude: |
          (?x)^(
            backend/.*/migrations/.*|
            backend/.venv/.*
          )$

  # ──────────────────────────────────────────────
  # Frontend: Prettier
  # ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npm exec -- prettier --check .'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(vue|ts|tsx|js|jsx|cjs|mjs|json|css|md)$
        exclude: |
          (?x)^(
            frontend/node_modules/.*|
            frontend/dist/.*|
            frontend/coverage/.*|
            frontend/.*\.d\.ts|
            frontend/.*\.tsbuildinfo
          )$

  # ──────────────────────────────────────────────
  # Frontend: ESLint
  # ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(vue|ts|tsx|js|jsx|cjs|mjs)$
        exclude: |
          (?x)^(
            frontend/node_modules/.*|
            frontend/dist/.*|
            frontend/coverage/.*
          )$
