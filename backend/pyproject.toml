[project]
name = "legatio-backend"
version = "0.1.0"
description = "Legatio AI — Backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["legatio", "apps", "services", "core", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["legatio", "apps", "services", "core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "legatio.settings.development"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Converter 'drf_format_suffix' is already registered.*:DeprecationWarning",
]
asyncio_default_fixture_loop_scope = "function"
DJANGO_SETTINGS_MODULE = "legatio.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["apps", "services", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/settings/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

# Test modules: relax strict typing (fixtures, Django TestCase patterns, dynamic attrs)
[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "var-annotated",
    "valid-type",
    "unused-ignore",
    "arg-type",
    "call-arg",
    "attr-defined",
    "union-attr",
    "misc",
    "func-returns-value",
    "type-arg",
]

# Channels / Celery third-party typing gaps
[[tool.mypy.overrides]]
module = [
    "apps.notifications.middleware",
    "apps.notifications.consumers",
    "apps.approvals.tasks",
    "legatio.celery",
]
disable_error_code = ["misc", "type-arg"]
