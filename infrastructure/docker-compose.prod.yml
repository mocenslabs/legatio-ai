name: legatio-prod
services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-legatio}
      - POSTGRES_USER=${DB_USER:-legatio}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-legatio}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-legatio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis (Cache + Message Broker)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ──────────────────────────────────────────────
  # Celery Worker (Async task processing)
  # ──────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    command: celery -A legatio worker --loglevel=info --concurrency=2
    volumes:
      - media_volume:/app/mediafiles
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ──────────────────────────────────────────────
  # Celery Beat (Scheduled tasks)
  # ──────────────────────────────────────────────
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    command: celery -A legatio beat --loglevel=info
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
