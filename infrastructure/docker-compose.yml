# =============================================================================
# Legatio AI — Development Docker Compose
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-legatio}

x-backend-base: &backend-base
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - legatio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legatio}
      POSTGRES_USER: ${POSTGRES_USER:-legatio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - legatio

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - legatio

  backend:
    <<: *backend-base
    ports:
      - "${BACKEND_INTERNAL_PORT:-8000}:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ../backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend-base
    command: ["celery", "-A", "legatio", "worker", "--loglevel=info"]
    volumes:
      - ../backend:/app

  beat:
    <<: *backend-base
    command: ["celery", "-A", "legatio", "beat", "--loglevel=info"]
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    restart: unless-stopped
    ports:
      - "${FRONTEND_INTERNAL_PORT:-5173}:5173"
    command: ["npm", "run", "dev"]
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - legatio

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - legatio

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  legatio:
    name: ${COMPOSE_PROJECT_NAME:-legatio}_default
